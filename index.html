<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      const path = window.location.pathname || "/";
      const indexFile = "index.html";
      const basePath = path.endsWith(`/${indexFile}`)
        ? path.slice(0, -indexFile.length)
        : (path.endsWith("/") ? path : `${path}/`);
      window.location.replace(`${basePath}home.html`);
    })();
  </script>
  <title>Redirecting...</title>
</head>
<body>
  If you are not redirected, <a href="./home.html">click here</a>.
</body>
</html>
