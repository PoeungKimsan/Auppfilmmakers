<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
</head>
<body>
  If you are not redirected, <a id="fallback-home-link" href="home.html">click here</a>.
  <script>
    (function () {
      const path = window.location.pathname;
      let basePath;
      if (path.endsWith("/index.html")) {
        basePath = path.replace(/index\.html$/, "");
      } else if (path.endsWith("/")) {
        basePath = path;
      } else {
        basePath = `${path}/`;
      }

      const homePath = `${basePath}home.html`;
      const fallbackLink = document.getElementById("fallback-home-link");
      if (fallbackLink) fallbackLink.href = homePath;
      window.location.replace(homePath);
    })();
  </script>
</body>
</html>
