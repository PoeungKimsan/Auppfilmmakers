<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      const path = window.location.pathname;
      const basePath = path.endsWith("/index.html")
        ? path.replace(/index\.html$/, "")
        : (path.endsWith("/") ? path : `${path}/`);
      window.location.replace(`${basePath}home.html`);
    })();
  </script>
  <title>Redirecting...</title>
</head>
<body>
  If you are not redirected, <a href="./home.html">click here</a>.
</body>
</html>
