<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
</head>
<body>
  If you are not redirected, <a id="fallback-home-link" href="home.html">go to the home page</a>.
  <script>
    (function () {
      const path = window.location.pathname;
      let basePath;
      if (path.endsWith("/")) {
        basePath = path;
      } else {
        const lastSlashIndex = path.lastIndexOf("/");
        const lastSegment = path.substring(lastSlashIndex + 1);
        if (lastSegment.includes(".")) {
          basePath = path.substring(0, lastSlashIndex + 1);
        } else {
          basePath = `${path}/`;
        }
      }

      const homePath = `${basePath}home.html`;
      const fallbackLink = document.getElementById("fallback-home-link");
      fallbackLink.href = homePath;
      window.location.replace(homePath);
    })();
  </script>
</body>
</html>
