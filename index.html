<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
</head>
<body>
  If you are not redirected, <a id="fallback-home-link" href="home.html">go to the home page</a>.
  <script>
    (function () {
      const { pathname } = window.location;
      let basePath;
      if (pathname.endsWith("/index.html")) {
        basePath = pathname.replace(/index\.html$/, "");
      } else if (!pathname.endsWith("/")) {
        basePath = `${pathname}/`;
      } else {
        basePath = pathname;
      }

      const homePath = `${basePath}home.html`;
      const fallbackLink = document.getElementById("fallback-home-link");
      fallbackLink.href = homePath;
      window.location.replace(homePath);
    })();
  </script>
</body>
</html>
